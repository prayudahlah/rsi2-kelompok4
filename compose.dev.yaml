services:
  fastapi:
    build: ./backend
    image: fastapi:latest
    container_name: fastapi-rsi2
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    ports:
      - "8000:8000"
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - __pycache__/
            - '*.pyc'
            - .pytest_cache/
            - tests/
            - '*.log'

        - action: rebuild
          path: ./requirements.txt

        - action: rebuild
          path: ./backend/pyproject.toml

        - action: rebuild
          path: ./backend/uv.lock

        - action: rebuild
          path: ./backend/Dockerfile

        - action: sync
          path: ./backend/.env
          target: /app/.env

        - action: sync
          path: ./backend/alembic.ini
          target: /app/alembic.ini

        - action: sync
          path: ./backend/migrations
          target: /app/migrations
          ignore:
            - __pycache__/
            - '*.pyc'

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nextjs-rsi2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./frontend/components
          target: /app/components
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/lib
          target: /app/lib
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile.dev
    depends_on:
      - fastapi
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
