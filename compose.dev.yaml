services:
  fastapi:
    build: ./backend
    image: fastapi:latest
    container_name: fastapi-rsi2
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - __pycache__/
            - '*.pyc'
            - .pytest_cache/
            - tests/
            - '*.log'

        - action: rebuild
          path: ./requirements.txt

        - action: rebuild
          path: ./backend/pyproject.toml

        - action: rebuild
          path: ./backend/uv.lock

        - action: rebuild
          path: ./backend/Dockerfile

        - action: sync
          path: ./backend/.env
          target: /app/.env

        - action: sync
          path: ./backend/alembic.ini
          target: /app/alembic.ini

        - action: sync
          path: ./backend/migrations
          target: /app/migrations
          ignore:
            - __pycache__/
            - '*.pyc'
